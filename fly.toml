# Fly.io deployment for the FULL app - the notebook, not the read-only Pages
# board. Roadmap phase 2 says nothing else matters until the owner can log a
# real session from the bank, and that needs a writable database on a host.
#
# Deploy:
#   fly auth login
#   fly launch --no-deploy --copy-config --name fishlog-pomocnia --region waw
#   fly volumes create fishlog_data --size 1 --region waw
#   fly deploy
#
# `waw` is Warsaw: same country as the lake and as the angler, so latency on a
# phone at the bank is a few milliseconds rather than a transatlantic round trip.

app = "fishlog-pomocnia"
primary_region = "waw"

[build]
  dockerfile = "Dockerfile"

[env]
  FISHLOG_DB_PATH = "/data/fishlog.db"
  FISHLOG_MEDIA_DIR = "/data/media"

# THE IMPORTANT PART. SQLite is a file; without this mount it lives in the
# container's ephemeral layer and every deploy silently destroys every logged
# session and every immutable prediction row. Catch photos go here too.
[[mounts]]
  source = "fishlog_data"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true

  # NEVER scale this to zero, and never past one machine.
  #
  # min_machines_running = 0 would suspend the app between visits, and
  # APScheduler only runs while the process is alive - the hourly weather
  # ingest would simply stop, leaving gaps in `weather_hourly` that cannot be
  # backfilled from a forecast API. The whole point is a 24/7 record.
  #
  # More than one machine is worse: two processes would share no SQLite file,
  # both would run the scheduler, and both would write predictions.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

[checks.up]
  type = "http"
  port = 8000
  path = "/"
  interval = "60s"
  timeout = "5s"
  grace_period = "20s"
