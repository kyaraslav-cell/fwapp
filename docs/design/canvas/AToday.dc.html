<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700&family=Nunito:wght@400;600;700&display=swap">
  <style>
    body { margin:0; font-family:'Nunito',system-ui,sans-serif; }
    a { color:#B2541C; } a:hover { color:#8A3F14; }
    .scr { width:390px; height:844px; background:#EFE7D6; position:relative; overflow:hidden;
           display:flex; flex-direction:column; color:#2E2A20; }
    .disp { font-family:'Baloo 2',system-ui,sans-serif; }
    .tray { background:#FBF7EF; border-radius:22px; border:1px solid #DED2B8; }
    .n { font-size:12px; color:#6B6250; font-weight:700; font-variant-numeric:tabular-nums; }
  </style>
</helmet>

<div class="scr">

  <div style="padding:24px 22px 4px; display:flex; align-items:center; justify-content:space-between">
    <div>
      <div class="disp" style="font-size:25px; font-weight:700">Today</div>
      <div style="font-size:14px; color:#6B6250; font-weight:600">Jezioro Pomocnia</div>
    </div>
    <!-- reel: spool in side profile with handle arm and knob, on a foot -->
    <svg width="40" height="40" viewBox="0 0 44 44" aria-hidden="true">
      <rect x="12" y="13" width="20" height="18" rx="4" fill="#E5D4AE" stroke="#8A7E60" stroke-width="2.2"/>
      <path d="M12 18 L32 18 M12 26 L32 26" stroke="#8A7E60" stroke-width="1.6"/>
      <path d="M32 22 L38 15" stroke="#8A7E60" stroke-width="2.6" stroke-linecap="round"/>
      <circle cx="39" cy="13" r="3.2" fill="#B2541C"/>
      <path d="M18 31 L18 37 L26 37" fill="none" stroke="#8A7E60" stroke-width="2.4" stroke-linecap="round"/>
    </svg>
  </div>

  <!-- the band. Tint carries the text; the saturated bar is the reserved signal. -->
  <div style="padding:14px 22px 0">
    <div class="tray" style="padding:0; overflow:hidden; border-color:#B7CBAA">
      <div style="height:8px; background:#2F7D4F"></div>
      <div style="background:#D6E9D2; padding:20px">
        <div class="disp" style="font-size:31px; font-weight:700; line-height:1.05">A good day</div>
        <div style="font-size:14px; color:#3B5230; font-weight:600; margin-top:6px">
          Falling pressure, warm south-west wind.
        </div>
      </div>
    </div>
  </div>

  <!-- 8 day strip -->
  <div style="padding:18px 22px 0">
    <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:9px">
      <div style="font-size:13px; font-weight:700; color:#6B6250; letter-spacing:.4px">NEXT 8 DAYS</div>
      <svg width="19" height="19" viewBox="0 0 24 24" aria-hidden="true">
        <rect x="3" y="5" width="18" height="16" rx="4" fill="none" stroke="#6B6250" stroke-width="2"/>
        <path d="M8 3 L8 7 M16 3 L16 7 M3 10 L21 10" stroke="#6B6250" stroke-width="2" stroke-linecap="round"/>
      </svg>
    </div>
    <div style="display:flex; gap:6px">
      <div style="flex-grow:1; text-align:center">
        <div style="height:44px; border-radius:12px; background:#D6E9D2; border:2px solid #2E2A20;
                    display:flex; align-items:flex-end; justify-content:center; padding-bottom:5px">
          <div style="width:16px; height:5px; border-radius:3px; background:#2F7D4F"></div>
        </div>
        <div class="n" style="margin-top:4px">Fri</div>
      </div>
      <div style="flex-grow:1; text-align:center">
        <div style="height:44px; border-radius:12px; background:#E6EBCB;
                    display:flex; align-items:flex-end; justify-content:center; padding-bottom:5px">
          <div style="width:16px; height:5px; border-radius:3px; background:#8DA53C"></div>
        </div>
        <div class="n" style="margin-top:4px">Sat</div>
      </div>
      <div style="flex-grow:1; text-align:center">
        <div style="height:44px; border-radius:12px; background:#E6EBCB;
                    display:flex; align-items:flex-end; justify-content:center; padding-bottom:5px">
          <div style="width:16px; height:5px; border-radius:3px; background:#8DA53C"></div>
        </div>
        <div class="n" style="margin-top:4px">Sun</div>
      </div>
      <div style="flex-grow:1; text-align:center">
        <div style="height:44px; border-radius:12px; background:#F7E2C0;
                    display:flex; align-items:flex-end; justify-content:center; padding-bottom:5px">
          <div style="width:16px; height:5px; border-radius:3px; background:#D99A2B"></div>
        </div>
        <div class="n" style="margin-top:4px">Mon</div>
      </div>
      <div style="flex-grow:1; text-align:center">
        <div style="height:44px; border-radius:12px; background:#F3D2CB;
                    display:flex; align-items:flex-end; justify-content:center; padding-bottom:5px">
          <div style="width:16px; height:5px; border-radius:3px; background:#C2452D"></div>
        </div>
        <div class="n" style="margin-top:4px">Tue</div>
      </div>
      <div style="flex-grow:1; text-align:center">
        <div style="height:44px; border-radius:12px; background:#F7E2C0;
                    display:flex; align-items:flex-end; justify-content:center; padding-bottom:5px">
          <div style="width:16px; height:5px; border-radius:3px; background:#D99A2B"></div>
        </div>
        <div class="n" style="margin-top:4px">Wed</div>
      </div>
      <div style="flex-grow:1; text-align:center">
        <div style="height:44px; border-radius:12px; background:#D6E9D2;
                    display:flex; align-items:flex-end; justify-content:center; padding-bottom:5px">
          <div style="width:16px; height:5px; border-radius:3px; background:#2F7D4F"></div>
        </div>
        <div class="n" style="margin-top:4px">Thu</div>
      </div>
    </div>
  </div>

  <!-- readouts, each with its n -->
  <div style="padding:20px 22px 0; display:flex; flex-direction:column; gap:10px; flex-grow:1">
    <div class="tray" style="padding:14px 16px; display:flex; align-items:center; gap:14px">
      <svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="8.5" fill="none" stroke="#8A7E60" stroke-width="2"/>
        <path d="M12 12 L16 8.5" stroke="#B2541C" stroke-width="2.4" stroke-linecap="round"/>
      </svg>
      <div style="flex-grow:1">
        <div style="font-size:13px; color:#6B6250; font-weight:700">PRESSURE</div>
        <div class="disp" style="font-size:20px; font-weight:600">1004 hPa · falling</div>
      </div>
      <div class="n">n 412</div>
    </div>
    <div class="tray" style="padding:14px 16px; display:flex; align-items:center; gap:14px">
      <svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M3 9 L14 9 A3 3 0 1 0 11 6" fill="none" stroke="#8A7E60" stroke-width="2" stroke-linecap="round"/>
        <path d="M3 14 L17 14 A3 3 0 1 1 14 17" fill="none" stroke="#8A7E60" stroke-width="2" stroke-linecap="round"/>
      </svg>
      <div style="flex-grow:1">
        <div style="font-size:13px; color:#6B6250; font-weight:700">WIND</div>
        <div class="disp" style="font-size:20px; font-weight:600">14 km/h SW</div>
      </div>
      <div class="n">n 412</div>
    </div>
    <div class="tray" style="padding:14px 16px; display:flex; align-items:center; gap:14px">
      <svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M10 4.5 A2.5 2.5 0 0 1 15 4.5 L15 13 A4.5 4.5 0 1 1 10 13 Z"
              fill="none" stroke="#8A7E60" stroke-width="2"/>
        <circle cx="12.5" cy="16.5" r="2.4" fill="#B2541C"/>
      </svg>
      <div style="flex-grow:1">
        <div style="font-size:13px; color:#6B6250; font-weight:700">WATER · MODELLED</div>
        <div class="disp" style="font-size:20px; font-weight:600">17.4 °C ± 1.2</div>
      </div>
      <div class="n">n 27</div>
    </div>
    <div style="font-size:13px; color:#6B6250; font-weight:600; padding:2px 4px">
      Modelled from air temperature — never measured in the water.
    </div>
  </div>

  <div style="padding:12px 22px 30px">
    <div class="disp" style="background:#B2541C; color:#FFF8EC; border-radius:999px; height:56px;
                display:flex; align-items:center; justify-content:center; gap:10px;
                font-size:18px; font-weight:600">
      Open the map
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
