<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700&family=Nunito:wght@400;600;700&display=swap">
  <style>
    body { margin:0; font-family:'Nunito',system-ui,sans-serif; }
    a { color:#B2541C; } a:hover { color:#8A3F14; }
    .scr { width:390px; height:844px; background:#EFE7D6; position:relative; overflow:hidden;
           display:flex; flex-direction:column; color:#2E2A20; }
    .disp { font-family:'Baloo 2',system-ui,sans-serif; }
    .tray { background:#FBF7EF; border-radius:22px; border:1px solid #DED2B8; }
    .chip { border-radius:999px; padding:9px 15px; font-size:14px; font-weight:700;
            border:1px solid #DED2B8; background:#FBF7EF; color:#5A5242; }
    .chip.on { background:#2E2A20; color:#FBF7EF; border-color:#2E2A20; }
    .tag { border-radius:999px; padding:3px 10px; font-size:12px; font-weight:700; }
  </style>
</helmet>

<div class="scr">

  <!-- decorative: a float lying across the top-right, and a jumping roach -->
  <svg width="140" height="150" viewBox="0 0 140 150" aria-hidden="true"
       style="position:absolute; top:-14px; right:-26px; opacity:.5">
    <g transform="rotate(24 70 75)">
      <path d="M70 18 L70 44" stroke="#C2452D" stroke-width="4" stroke-linecap="round"/>
      <path d="M70 44 C60 52 58 72 70 92 C82 72 80 52 70 44 Z" fill="#E5D4AE" stroke="#B9A77F" stroke-width="2"/>
      <path d="M70 92 L70 122" stroke="#B9A77F" stroke-width="3" stroke-linecap="round"/>
      <circle cx="70" cy="124" r="4.5" fill="none" stroke="#B9A77F" stroke-width="2.5"/>
    </g>
  </svg>

  <!-- header -->
  <div style="padding:26px 22px 10px; display:flex; align-items:baseline; gap:9px; position:relative">
    <div class="disp" style="font-size:29px; font-weight:700; letter-spacing:-0.5px">fwapp</div>
    <div style="font-size:13px; color:#6B6250; font-weight:600">4 waters</div>
  </div>

  <!-- filter row -->
  <div style="display:flex; gap:8px; padding:8px 22px 16px; overflow:hidden">
    <div class="chip on">All</div>
    <div class="chip">PZW</div>
    <div class="chip">Commercial</div>
    <div class="chip" style="padding:9px 13px">★</div>
  </div>

  <!-- water list -->
  <div style="display:flex; flex-direction:column; gap:12px; padding:0 22px; flex-grow:1">

    <div class="tray" style="padding:14px; display:flex; align-items:center; gap:14px">
      <svg width="52" height="52" viewBox="0 0 52 52" aria-hidden="true">
        <path d="M12 27 C9 16 21 8 32 11 C43 14 46 27 40 36 C33 46 16 43 12 27 Z"
              fill="#CFE0C4" stroke="#7C8F6B" stroke-width="2"/>
      </svg>
      <div style="flex-grow:1">
        <div class="disp" style="font-size:18px; font-weight:600">Jezioro Pomocnia</div>
        <div style="display:flex; gap:7px; align-items:center; margin-top:5px">
          <span class="tag" style="background:#DCE8D2; color:#3B5230">PZW</span>
          <span style="font-size:13px; color:#6B6250; font-weight:600">9 ha</span>
        </div>
      </div>
      <div style="font-size:21px; color:#D99A2B">★</div>
    </div>

    <div class="tray" style="padding:14px; display:flex; align-items:center; gap:14px">
      <svg width="52" height="52" viewBox="0 0 52 52" aria-hidden="true">
        <path d="M8 32 C10 18 20 9 33 12 C46 15 45 25 38 30 C31 35 34 43 24 44 C15 45 7 41 8 32 Z"
              fill="#CFE0C4" stroke="#7C8F6B" stroke-width="2"/>
      </svg>
      <div style="flex-grow:1">
        <div class="disp" style="font-size:18px; font-weight:600">Zalew Zegrzyński</div>
        <div style="display:flex; gap:7px; align-items:center; margin-top:5px">
          <span class="tag" style="background:#DCE8D2; color:#3B5230">PZW</span>
          <span style="font-size:13px; color:#6B6250; font-weight:600">3 030 ha</span>
        </div>
      </div>
      <div style="font-size:21px; color:#C4B896">☆</div>
    </div>

    <div class="tray" style="padding:14px; display:flex; align-items:center; gap:14px">
      <svg width="52" height="52" viewBox="0 0 52 52" aria-hidden="true">
        <path d="M6 14 C16 20 20 30 30 34 C38 37 42 42 46 46"
              fill="none" stroke="#7C8F6B" stroke-width="6" stroke-linecap="round"/>
      </svg>
      <div style="flex-grow:1">
        <div class="disp" style="font-size:18px; font-weight:600">Rzeka Narew nr 7</div>
        <div style="display:flex; gap:7px; align-items:center; margin-top:5px">
          <span class="tag" style="background:#DCE8D2; color:#3B5230">PZW</span>
          <span style="font-size:13px; color:#6B6250; font-weight:600">district</span>
        </div>
      </div>
      <div style="font-size:21px; color:#D99A2B">★</div>
    </div>

    <div class="tray" style="padding:14px; display:flex; align-items:center; gap:14px">
      <svg width="52" height="52" viewBox="0 0 52 52" aria-hidden="true">
        <path d="M14 20 C14 14 38 14 38 20 L38 33 C38 39 14 39 14 33 Z"
              fill="#CFE0C4" stroke="#7C8F6B" stroke-width="2"/>
      </svg>
      <div style="flex-grow:1">
        <div class="disp" style="font-size:18px; font-weight:600">Stawy Szczęśliwice</div>
        <div style="display:flex; gap:7px; align-items:center; margin-top:5px">
          <span class="tag" style="background:#F1E0C4; color:#6A4A18">Commercial</span>
          <span style="font-size:13px; color:#6B6250; font-weight:600">2.1 ha</span>
        </div>
      </div>
      <div style="font-size:21px; color:#C4B896">☆</div>
    </div>

  </div>

  <!-- a bream arcing across the lower third, decorative -->
  <svg width="150" height="70" viewBox="0 0 150 70" aria-hidden="true"
       style="position:absolute; left:-12px; bottom:150px; opacity:.35">
    <path d="M4 62 C34 22 96 20 132 40" fill="none" stroke="#B9A77F"
          stroke-width="2" stroke-dasharray="3 6" stroke-linecap="round"/>
    <g transform="translate(96 20) rotate(18)">
      <!-- bream: deep body, long unequal fork -->
      <path d="M13 13 C18 2 34 3 43 13 C34 24 18 25 13 13 Z" fill="#A9BE97"/>
      <path d="M13 13 L1 3 L6 13 L2 26 Z" fill="#A9BE97"/>
      <path d="M26 4.4 C28 0 33 0.5 34 4" fill="none" stroke="#A9BE97" stroke-width="2.4" stroke-linecap="round"/>
      <circle cx="38" cy="11" r="1.5" fill="#EFE7D6"/>
    </g>
  </svg>

  <!-- primary action, thumb zone -->
  <div style="padding:16px 22px 30px">
    <div class="disp" style="background:#B2541C; color:#FFF8EC; border-radius:999px; height:56px;
                display:flex; align-items:center; justify-content:center; gap:10px;
                font-size:18px; font-weight:600">
      <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 5 L12 19 M5 12 L19 12" stroke="#FFF8EC" stroke-width="2.6" stroke-linecap="round"/>
      </svg>
      Add a water
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
