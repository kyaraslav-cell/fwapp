<!doctype html>
<html lang="{{ lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>{% block title %}Fishlog{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
  <meta name="theme-color" content="#f2f8fd">
  {% block extra_head %}{% endblock %}
</head>
<body>
  <div class="topbar">
    <a href="/" class="brand" style="text-decoration:none;">{{ t('nav.brand') }}</a>
    <div style="display:flex; align-items:center; gap:8px;">
      <nav class="topnav">
        <a href="/" class="{{ 'active' if active_nav == 'home' }}">{{ t('nav.places') }}</a>
        <a href="/history" class="{{ 'active' if active_nav == 'history' }}">{{ t('nav.history') }}</a>
      </nav>
      <div class="lang-switch">
        {% for code, name in languages %}
        <a href="/lang/{{ code }}?next={{ current_path | urlencode }}"
           class="{{ 'active' if code == lang }}" title="{{ name }}">{{ code | upper }}</a>
        {% endfor %}
      </div>
    </div>
  </div>

  <main class="page{% block page_class %}{% endblock %}">
    {% block content %}{% endblock %}
  </main>

  <nav class="bottomnav">
    <a href="/" class="{{ 'active' if active_nav == 'home' }}">{{ t('nav.places') }}</a>
    <a href="/history" class="{{ 'active' if active_nav == 'history' }}">{{ t('nav.history') }}</a>
  </nav>
  {% block extra_script %}{% endblock %}
</body>
</html>
