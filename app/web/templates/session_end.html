{% extends "base.html" %}
{% block title %}End session — Fishlog{% endblock %}
{% block page_class %} narrow{% endblock %}
{% block content %}
<h1>End session</h1>

<form method="post" action="/session/end">
  <label class="blank-toggle">
    <input type="checkbox" name="is_blank" value="1">
    Finished, no fish (blank session — counts fully, no shame)
  </label>

  <label for="water_temp_measured_c">Water temperature °C (optional — highest-value field in the app)</label>
  <input type="number" step="0.1" id="water_temp_measured_c" name="water_temp_measured_c" placeholder="e.g. 16.5">

  <label for="water_clarity_cm">Water clarity, cm (optional)</label>
  <input type="number" step="1" id="water_clarity_cm" name="water_clarity_cm" placeholder="e.g. 40">

  <label for="reflection">What worked / what didn't (optional, 20 seconds)</label>
  <textarea id="reflection" name="reflection" placeholder="Free text..."></textarea>

  <div class="bottom-fixed">
    <button class="btn btn-primary btn-block-gap" type="submit">Save session</button>
    <a class="btn btn-ghost" href="/session/active">Cancel, keep fishing</a>
  </div>
</form>
{% endblock %}
