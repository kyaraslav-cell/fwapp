# Day-quality band. The ruleset stores an English label, and a prediction row
# is immutable (law 2), so the label cannot be rewritten per language - the
# colour is the stable identity and the wording is looked up from it here.
band:
  red: Poor
  orange: Marginal
  yellow: Fair
  green: Great

water_type:
  pzw: PZW water
  commercial: Commercial fishery
  unset: Water type not set

# Accounts. Error keys are returned by app/auth/validation.py, so a rule and
# its wording are edited in two files and only two files.
auth:
  signin: Sign in
  signout: Sign out
  or: or
  field:
    email: Email
    name: Name
    password: Password
    password_confirm: Repeat password
  hint:
    password: At least 10 characters. A phrase you will remember beats a short scramble.
  login:
    title: Sign in
    lede: Your notebook is yours. The lake, the weather and the map stay open to everyone.
    submit: Sign in
    no_account: No account yet?
  register:
    title: Create account
    lede: One account holds your sessions, your catches and your fish-per-hour.
    submit: Create account
    have_account: Already have an account?
  google:
    button: Continue with Google
  error:
    email_required: Enter your email address.
    email_invalid: That does not look like an email address.
    email_too_long: That address is too long.
    email_taken: There is already an account with this address.
    name_required: Enter a name to be known by.
    name_too_long: That name is too long.
    password_required: Enter a password.
    password_too_short: Use at least 10 characters.
    password_too_long: That password is too long.
    password_obvious: That password is one of the most guessed ones. Pick another.
    password_is_email: Your password must not contain your email address.
    password_repetitive: That password repeats too few different characters.
    password_mismatch: The two passwords do not match.
    bad_credentials: Wrong email or password.
    account_disabled: This account has been switched off.
    google_unavailable: Google sign-in is not configured on this server.
    google_cancelled: Google sign-in was cancelled.
    google_state: That sign-in link expired. Try again.
    google_failed: Google refused the sign-in.
    google_unreachable: Could not reach Google. Check the connection and try again.
    google_unverified: That Google account has an unverified email address.
    # {minutes} is filled in by app/auth/throttle.py. Quoted because a bare
    # value starting with a brace is a YAML flow mapping, and because a value
    # containing ": " has broken this catalogue once already.
    too_many: "Too many attempts - try again in {minutes} min."

# The day strip behind the calendar icon on the lake page. Weekday keys are
# lowercase %a, so the template can look one up without a mapping table.
weekday:
  mon: Mon
  tue: Tue
  wed: Wed
  thu: Thu
  fri: Fri
  sat: Sat
  sun: Sun

calendar:
  toggle: Next days
  badge: Forecast
  note: Colour is the day's outlook - pick a day to recolour the map; faded days are far out and less certain.
  no_reason: No prediction was written for that day.
  forecast_only: Forecast view. Pick today to start a session.

# Why a day scored what it did - one clause, appended to the pressure change.
# The regime names come from config/rules.v*.yaml; only the wording is here.
# Deliberately neutral: which regime is *good* is a weight in the ruleset and
# would go stale in here the first time the owner changes it. The colour on the
# chip already carries good or bad.
dayreason:
  falling_fast: Pressure dropping sharply
  falling_slow: Pressure easing off
  stable: Pressure steady
  rising_slow: Pressure creeping up
  rising_fast: Pressure climbing fast
  unclear: No clear pressure trend
  no_history: Not enough pressure history yet
  change_down: "({hpa} hPa down over six hours)"
  change_up: "({hpa} hPa up over six hours)"
  rating_best: rated the best of the pressure states
  rating_good: rated well
  rating_middling: rated middling
  rating_poor: rated low
  rating_worst: rated the worst of the pressure states

discover:
  field:
    name: Name of the water
  placeholder: e.g. Jezioro Zegrzyńskie
  hint: PZW waters and commercial fisheries are all named. Type the name as it is signposted.
  search: Search
  add: Add
  not_water: Not a water
  already_added: Already here
  nothing_found: Nothing found by that name.
  quota_left: Waters you can still add today
  quota_reset: Try again after
  error:
    geocoder: The map search service could not be reached. Nothing was added - try again in a moment.
    quota: You have added your allowance of waters for today.
    not_water: That result is not a water. Pick one marked as a lake or pond.

build:
  outline: Fetching this water's shoreline from OpenStreetMap. The map works meanwhile - the overlay needs the shape.
  weather: Fetching a year of weather so this water gets a pressure norm of its own. The day colours appear when it lands.
  grid: Building the zone grid. The overlay appears when it is done.
  no_outline: OpenStreetMap has no shoreline for this water, so there is no zone overlay. Everything else works.
  failed: Something in preparing this water failed. It will be retried; the map and the forecast still work.

# Local knowledge collected from public pages. The note is one sentence by the
# owner's standing rule, and it has to carry the whole caveat: nothing here has
# been verified and none of it reaches the score.
intel:
  title: Local knowledge
  note: Collected from public pages and not verified - open a source to check it.
  source_dead: link dead
  topic:
    species: Fish present
    depth: Depth
    bottom: Bottom
    access: Access
    rules: Rules and permits
    stocking: Stocking

# 404 and 500. Two sentences total - whoever is reading this did not mean to
# be here and wants the way back, not an explanation.
error:
  home: Back to your places
  not_found:
    title: Not here
    body: That page does not exist, or the water was removed.
  server:
    title: Something broke
    body: This one is our fault - it has been logged. Try again in a moment.
