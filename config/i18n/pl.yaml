build:
  outline: Pobieramy linię brzegową z OpenStreetMap. Mapa już działa - nakładka potrzebuje kształtu.
  weather: Pobieramy rok pogody, aby akwen miał własną normę ciśnienia. Kolory dni pojawią się po zakończeniu.
  grid: Budujemy siatkę stref. Nakładka pojawi się po zakończeniu.
  no_outline: OpenStreetMap nie ma linii brzegowej tego akwenu, więc nie ma nakładki stref. Reszta działa.
