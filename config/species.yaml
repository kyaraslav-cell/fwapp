# Fish species present in / relevant to Jezioro Pomocnia and Polish lowland
# lakes generally. Taxonomy and Polish common names are reference data, not
# angling heuristics - no thresholds or weights live here (law 1).
#
# `scoring` mirrors the scope set in CLAUDE.md:
#   primary     - the four target cyprinids the app is built around
#   secondary   - scored, because they dominate this water
#   logged_only - recorded but never scored (out of scope for prediction)

species:
  # --- primary: bank-fished cyprinids, the target of the whole app ----------
  - { slug: roach,      name_en: Roach,            name_pl: Płoć,            scientific: Rutilus rutilus,        family: Cyprinidae, scoring: primary,     favourite: true, shape: cyprinid, typical_g: 120, min_g: 10, max_g: 1200, typical_cm: 18, min_cm: 6, max_cm: 40, color: "#8FB6D6" }
  - { slug: bream,      name_en: Common bream,     name_pl: Leszcz,          scientific: Abramis brama,          family: Cyprinidae, scoring: primary,     favourite: true, shape: deep, typical_g: 800, min_g: 50, max_g: 6000, typical_cm: 35, min_cm: 12, max_cm: 70, color: "#B99A66" }
  - { slug: rudd,       name_en: Rudd,             name_pl: Wzdręga,         scientific: Scardinius erythrophthalmus, family: Cyprinidae, scoring: primary, favourite: true, shape: cyprinid, typical_g: 150, min_g: 15, max_g: 1500, typical_cm: 20, min_cm: 7, max_cm: 42, color: "#D9A441" }
  - { slug: ide,        name_en: Ide,              name_pl: Jaź,             scientific: Leuciscus idus,         family: Cyprinidae, scoring: primary,     favourite: true, shape: cyprinid, typical_g: 500, min_g: 50, max_g: 4000, typical_cm: 30, min_cm: 12, max_cm: 63, color: "#9FB8C9" }

  # --- secondary: scored because they dominate this water -------------------
  - { slug: carp,       name_en: Common carp,      name_pl: Karp,            scientific: Cyprinus carpio,        family: Cyprinidae, scoring: secondary,   favourite: true, shape: carp, typical_g: 4000, min_g: 300, max_g: 25000, typical_cm: 50, min_cm: 18, max_cm: 100, color: "#C9903F" }
  - { slug: crucian,    name_en: Crucian carp,     name_pl: Karaś,           scientific: Carassius carassius,    family: Cyprinidae, scoring: secondary,   favourite: true, shape: deep, typical_g: 300, min_g: 30, max_g: 3000, typical_cm: 20, min_cm: 8, max_cm: 45, color: "#C2A24E" }

  # --- logged only: recorded, never scored ---------------------------------
  - { slug: tench,      name_en: Tench,            name_pl: Lin,             scientific: Tinca tinca,            family: Cyprinidae, scoring: logged_only, shape: deep, typical_g: 900, min_g: 80, max_g: 6000, typical_cm: 32, min_cm: 12, max_cm: 60, color: "#4E7A5C" }
  - { slug: silver_bream, name_en: Silver bream,   name_pl: Krąp,            scientific: Blicca bjoerkna,        family: Cyprinidae, scoring: logged_only, shape: deep, typical_g: 120, min_g: 20, max_g: 800, typical_cm: 17, min_cm: 8, max_cm: 35, color: "#A9BCCB" }
  - { slug: gudgeon,    name_en: Gudgeon,          name_pl: Kiełb,           scientific: Gobio gobio,            family: Cyprinidae, scoring: logged_only, shape: small, typical_g: 20, min_g: 3, max_g: 200, typical_cm: 10, min_cm: 5, max_cm: 20, color: "#9A8B72" }
  - { slug: bleak,      name_en: Bleak,            name_pl: Ukleja,          scientific: Alburnus alburnus,      family: Cyprinidae, scoring: logged_only, shape: small, typical_g: 25, min_g: 3, max_g: 150, typical_cm: 12, min_cm: 5, max_cm: 22, color: "#B9C7D2" }
  - { slug: chub,       name_en: Chub,             name_pl: Kleń,            scientific: Squalius cephalus,      family: Cyprinidae, scoring: logged_only, shape: cyprinid, typical_g: 700, min_g: 50, max_g: 6000, typical_cm: 33, min_cm: 12, max_cm: 65, color: "#8FA98F" }
